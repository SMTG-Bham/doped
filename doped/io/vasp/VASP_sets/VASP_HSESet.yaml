INCAR:  # These settings are only added to the INCAR settings if LHFCALC is not set to False in user_incar_settings
  AEXX: 0.25  # HSE06 assumed by default. Set AEXX in INCAR config settings to tune alpha xc parameter.
  HFSCREEN: 0.2  # HSE06 screening parameter in Å⁻¹, matching VASP, ``pymatgen``/``MP``/``atomate2`` choice
  # (technically the original HSE06 definition is ω = 0.11 bohr⁻¹ = 0.2079 Å⁻¹ (https://doi.org/10.1063/1.2404663),
  # but 0.2 is commonly used (near-negligible difference in electronic structure / relative energies, but affects
  # absolute energies). Change to 0 for PBE0.
  LHFCALC: true
  PRECFOCK: Fast
  GGA: PE  # underlying GGA functional for HSE/PBE0 is PBE
