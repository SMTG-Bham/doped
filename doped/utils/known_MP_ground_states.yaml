# Known Materials Project (MP) ground-state / room-temperature phases for common
# elements and compounds, which can be used to reduce the number of competing-phase
# calculations required for chemical potential / phase diagram analyses, when appropriate.
#
# Keys are composition formulae; values are lists of MP IDs (mp-* identifiers) for
# phases that are typically relevant as the lowest-energy / room-temperature phases.
# See ``docs/known_MP_ground_states.md`` for full discussion, citations, and the
# rationale behind each entry.

# Chalcogens
S: [mp-77, mp-994911, mp-1064933]
Se: [mp-14, mp-570481]
Te: [mp-19]

